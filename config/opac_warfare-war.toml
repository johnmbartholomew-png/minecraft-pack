#Seconds between /war start and the chunk becoming contested.
# Default: 300
# Range: 5 ~ 86400
preparation_seconds = 300
#Maximum active war duration in seconds.
# Default: 3600
# Range: 60 ~ 604800
max_duration_seconds = 3600
#Whether diagonal adjacency counts when checking if a target chunk is a border chunk.
allow_diagonal_border_chunks = false
#Players with no tracked interaction for this many seconds are treated as AFK.
# Default: 300
# Range: 30 ~ 86400
afk_seconds = 300

	[war.capture]
		#Capture progress assigned when the active phase starts.
		# Default: 50.0
		# Range: 0.0 ~ 100.0
		starting_progress = 50.0
		#Base capture progress per second with 1 attacker present in the sector.
		# Default: 0.4
		# Range: 0.0 ~ 100.0
		base_rate_per_second = 0.4
		#Additional capture progress per second for each extra attacker beyond the first.
		# Default: 0.05
		# Range: 0.0 ~ 100.0
		extra_attacker_bonus_per_second = 0.05
		#Hard ceiling cap on attacker capture progress gain per second (anti-zerg cap).
		# Default: 0.6
		# Range: 0.0 ~ 100.0
		max_capture_rate_per_second = 0.6
		#Progress reduction per second per defending player inside the sector.
		# Default: 0.35
		# Range: 0.0 ~ 100.0
		defender_weight_per_second = 0.35
		#If true, all players in an actively contested sector receive the Glowing effect to prevent hiding.
		glowing_effect_enabled = true
		#Progress decay per second when no non-AFK attackers or defenders are in the contested chunk.
		# Default: 0.5
		# Range: 0.0 ~ 100.0
		empty_chunk_decay_per_second = 0.5

	[war.sector]
		#Maximum number of connected chunks included in a sector conquest wedge.
		# Default: 4
		# Range: 1 ~ 6
		max_chunks = 4
		#Maximum depth of chunks from the border eligible for conquest in a single siege.
		# Default: 2
		# Range: 1 ~ 4
		max_conquest_depth_chunks = 2

	[war.discord]
		#Discord webhook URL for siege start, active, and finish embed notifications. Empty disables.
		webhook_url = ""
		#Language for Discord webhook embed notifications: 'ru_ru' or 'en_us'.
		webhook_language = "en_us"

	[war.cooldown]
		#Fixed cooldown window for war starts by one attacking side. Set to 0 to disable the time window.
		# Default: 7200
		# Range: 0 ~ 604800
		attacker_seconds = 7200
		#Fixed protection cooldown window after a side accepts its first incoming war. Set to 0 to disable the time window.
		# Default: 3600
		# Range: 0 ~ 604800
		defender_seconds = 3600
		#Maximum concurrent and successful war target starts for one attacking side during its cooldown window.
		# Default: 1
		# Range: 1 ~ 1024
		max_started_chunks_per_attacker_side = 1
		#Maximum concurrent and successful incoming war target starts for one defending side during its protection cooldown window.
		# Default: 1
		# Range: 1 ~ 1024
		max_accepted_chunks_per_defender_side = 1

	[war.daily_start_limit]
		#Maximum successful war target chunk starts per attacking side per configured day. Set to 0 to disable.
		# Default: 0
		# Range: 0 ~ 1024
		max_started_chunks_per_attacker_side = 0
		#Maximum successful incoming war target chunk starts per defending side per configured day. Set to 0 to disable.
		# Default: 0
		# Range: 0 ~ 1024
		max_accepted_chunks_per_defender_side = 0

	[war.notifications]
		#If true, war chat notifications are sent to every online player instead of only the involved sides.
		broadcast_to_all_players = true

	[war.lives]
		#Personal war lives assigned to each current attacker/defender side member when a war becomes active.
		# Default: 3
		# Range: 1 ~ 100
		starting_lives = 3
		#If true, active war lives are shown in the vanilla sidebar scoreboard.
		scoreboard_sidebar_enabled = true
		#Objective name used for the war lives sidebar scoreboard.
		scoreboard_objective = "cc_war_lives"

	[war.contested_claim]
		#UUID used as the fake player owner of contested war chunks.
		owner_uuid = "a9d1645e-b816-3b60-b6d4-d5581ff24009"
		#Display name for the contested territory fake player claim.
		name = "Contested Territory"
		#Color (ARGB integer) for contested territory claims on maps. Default is -3342336 (0xFFCC0000).
		# Default: -3342336
		# Range: > -2147483648
		color = -3342336

[raid_window]
	#If enabled, /war start is blocked inside configured raid windows.
	enable_raid_window = true
	#Timezone for raid windows.
	timezone = "Europe/Moscow"
	#Blocked raid windows in HH:mm-HH:mm form.
	blocked_windows = ["04:00-08:00"]
	#If false, active wars are failed when a blocked raid window starts.
	allow_ongoing_wars_to_continue_after_window_start = true

[war_ui]
	#Chunk radius around a war target where players see the war bossbar.
	# Default: 3
	# Range: 0 ~ 64
	bossbar_visible_radius_chunks = 3
	#If true, every online player sees every active or preparing war bossbar regardless of distance or dimension.
	bossbar_visible_to_all_players = true
